defaults:
  - _self_

study_name: default

compute:
  ngpus: 1
  nodes: 1

logging:
  log_freq: 100
  log_lr_every: ${logging.log_freq}
  log_file_name: stdout.log
  enable_wandb: True
  entity: mattias421
  project: flow_matching
  group: null

data:
  text_data: /path/to/text.txt
  features_path: /path/to/features/dir
  num_workers: 1
  debug: false
  codec_name: mimi # [focalcodec, mimi]
  train_percent: 100
  supervised: True
  text_tokenizer: speecht5

training:
  batch_size: 32
  snapshot: 500
  eval_freq: 500
  perplexity_freq: 5000000
  uer_freq: 500
  seed: 42
  partial_loss_weight: 1
  uncond_warmup: 10000
  pad_weight: 1.0
  codebook_prob: 0.3
  time_conditioning: true
  t_min: 0.8

eval:
  batch_size: 32
  sample_batch_size: 16
  perplexity: True
  perplexity_batch_size: 128
  n_gen_iter: 8
  kenlm_path: /path/to/kenlm
  inference_block: 1

optim:
  weight_decay: 0.0007
  optimizer: AdamW
  lr: 4e-4
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  warmup: 2500
  grad_clip: 1.
  eta_min_ratio: 0.1
  fused: false
  n_iters: 100000
  log_lr_every: ${logging.log_lr_every}
  source_soft_update_weight: 0.05
  loss_speech_weight: 0.25

flow:
  source_distribution: mask  # [asr]
  loss_function: cross_entropy  # [cross_entropy, generalized_kl]
  exponent: 1.
  scheduler_type: polynomial
  sampling_steps: 64
  partial_noise_prob: 0

model:
  hidden_size: 768
  cond_dim: 128
  length: 512
  n_blocks: 2
  n_heads: 12
  dropout: 0.1
  compile: True
  whisper_dim: 768
  vocab_size_speech: 2048
  n_quantizers: 100
  quantizer_groups: 3

hydra_dir: /path/to/hydra/dir

hydra:
  run:
    dir: ${hydra_dir}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: ${hydra_dir}/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}

